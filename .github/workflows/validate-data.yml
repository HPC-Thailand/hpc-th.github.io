name: Validate data and prerendered HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON data files
        run: node tools/validate-data.mjs

      # The site serves prerendered HTML so that search engines and AI agents,
      # which do not run JavaScript, can read it. That HTML is generated from
      # data/ and committed, so it has to be regenerated whenever data changes.
      - name: Check prerendered HTML is up to date
        run: node tools/prerender.mjs --check
