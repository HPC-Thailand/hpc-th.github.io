name: Submit or update an HPC system
description: ส่งข้อมูลระบบ HPC ใหม่ หรืออัปเดตสเปกของระบบเดิม / Add or update an HPC system
title: "[system] "
labels: ["data", "system"]
body:
  - type: markdown
    attributes:
      value: |
        ข้อมูลที่ส่งจะเป็นสาธารณะ — กรุณาอย่าใส่ข้อมูลส่วนบุคคล รหัสผ่าน API key
        หรือข้อมูลภายในที่ไม่ต้องการเปิดเผย ใช้อีเมลกลางของหน่วยงานแทนอีเมลส่วนตัว

        This submission is public — do not include personal data, passwords, API keys
        or anything internal. Use a team mailbox rather than a personal address.
  - type: input
    id: name
    attributes:
      label: ชื่อระบบ / System name
    validations: { required: true }
  - type: input
    id: org
    attributes:
      label: หน่วยงาน / Organisation
    validations: { required: true }
  - type: textarea
    id: specs
    attributes:
      label: สเปก / Specifications
      description: CPU/GPU per model plus totals — see schema/systems.schema.json
      placeholder: |
        CPU types: model, nodes, sockets_per_node, cores_per_node, memory_per_node_gb
        GPU types: model, nodes, gpu_per_node, memory_per_unit_gb
        Totals: total_nodes, total_cpu_cores, total_gpu_count, total_memory_tb
        Interconnect: InfiniBand NDR + 400 Gb/s, Storage: Lustre + 5 PB
        Optional: scheduler, peak/sustained PFLOPS, power kW, access model
    validations: { required: true }
  - type: input
    id: location
    attributes:
      label: ที่ตั้ง / Location
      description: Province and lat,lng — stored on the organisation (add org_id if it already exists)
    validations: { required: true }
  - type: input
    id: website
    attributes:
      label: เว็บไซต์อ้างอิง / Reference URL
  - type: input
    id: access
    attributes:
      label: Vendor / scheduler / access
      placeholder: Dell | Slurm | open_academic — who can use it
