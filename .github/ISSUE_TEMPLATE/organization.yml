name: Add an organisation
description: Add or update an organisation that operates HPC systems / หน่วยงาน (องค์กร)
title: "[organization] "
labels: ["data", "organization"]
body:
  - type: markdown
    attributes:
      value: |
        This submission is public — do not include personal data or private contact details.
        Systems in data/systems.json reference organisations by org_id, so a system submission
        needs its organisation to exist here first (the JSON template is in data/schema/organizations.schema.json).
  - type: input
    id: org_id
    attributes:
      label: org_id (slug, e.g. 'thaisc')
    validations: { required: true }
  - type: input
    id: name
    attributes:
      label: Name (Thai and English)
      placeholder: Thai name / English name
    validations: { required: true }
  - type: dropdown
    id: org_type
    attributes:
      label: Organisation type
      options:
        - government_research
        - university
        - private
        - state_enterprise
    validations: { required: true }
  - type: input
    id: parent
    attributes:
      label: Parent org_id (optional, e.g. nstda for ThaiSC)
  - type: input
    id: location
    attributes:
      label: Province and coordinates
      placeholder: "Pathum Thani, lat 14.0674 lng 100.6035"
    validations: { required: true }
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://example.ac.th
  - type: input
    id: contact_email
    attributes:
      label: Team contact email (not personal)
  - type: textarea
    id: details
    attributes:
      label: Source / notes
      description: Where should we verify this from? (official page, publication, etc.)
