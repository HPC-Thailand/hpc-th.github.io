<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติศาสตร์ HPC ในประเทศไทย — HPC Thailand</title>
<meta name="description" content="ไทม์ไลน์ประวัติศาสตร์คอมพิวเตอร์สมรรถนะสูง (HPC) ในประเทศไทย ตั้งแต่ IBM 1620 เครื่องแรกในปี 2506 จนถึงยุค AI-HPC — History of high performance computing in Thailand.">
<meta name="keywords" content="HPC Thailand, ซูเปอร์คอมพิวเตอร์, high performance computing, LANTA, TARA, ThaiSC, NECTEC, NSTDA, AI-HPC, ประวัติศาสตร์ HPC">
<link rel="canonical" href="https://hpc.in.th/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="HPC Thailand">
<meta property="og:title" content="ประวัติศาสตร์ HPC ในประเทศไทย">
<meta property="og:description" content="หกทศวรรษของการประมวลผลสมรรถนะสูงในประเทศไทย — จาก IBM 1620 สู่ยุค AI-HPC">
<meta property="og:url" content="https://hpc.in.th/">
<meta property="og:image" content="https://hpc.in.th/assets/img/slides/p1-thumb.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  // Apply the stored theme before first paint to avoid a flash.
  try { document.documentElement.dataset.theme =
    localStorage.getItem('hpcth.theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
</script>
</head>

<body>
<a class="skip-link" href="#main" data-i18n="nav.skip">ข้ามไปยังเนื้อหาหลัก</a>
<header class="site-header" id="site-header"></header>

<main id="main">

  <section class="hero">
    <div class="container hero-grid">
      <div>
        <span class="eyebrow" data-i18n="home.eyebrow"></span>
        <h1 data-i18n="home.title"></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#timeline-section" data-i18n="home.ctaTimeline"></a>
          <a class="btn btn-ghost" href="/submit/" data-i18n="home.ctaSubmit"></a>
        </div>
      </div>
      <div class="hero-stats" id="hero-stats"></div>
    </div>
  </section>

  <section class="section" id="timeline-section">
    <div class="tl-controls">
      <div class="container tl-controls-inner">
        <div class="chips" id="era-chips" role="group" aria-label="Era filter"></div>
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <label class="visually-hidden" for="tl-search" data-i18n="timeline.searchLabel"></label>
          <input type="search" id="tl-search" autocomplete="off"
                 data-i18n-attr="placeholder:timeline.searchPlaceholder">
        </div>
      </div>
    </div>

    <div class="container">
      <p class="result-count" id="result-count"></p>
      <noscript>
        <div class="notice notice-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <p class="mb-0">ไทม์ไลน์นี้แสดงผลด้วย JavaScript — ข้อมูลดิบทั้งหมดอยู่ที่
            <a href="/data/timeline.json">data/timeline.json</a><br>
            This timeline is rendered with JavaScript — the raw data lives in
            <a href="/data/timeline.json">data/timeline.json</a>.</p>
        </div>
      </noscript>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="section-head reveal">
        <h2 data-i18n="slides.title"></h2>
        <p data-i18n="slides.lead"></p>
      </div>
      <div class="slide-grid reveal" id="slide-grid"></div>
      <p class="result-count" style="margin-top:18px" id="source-note"></p>
    </div>
  </section>

</main>

<dialog class="lightbox" id="lightbox" aria-label="Slide viewer">
  <img src="" alt="">
  <div class="lightbox-bar">
    <button type="button" id="lb-prev" data-i18n="slides.prev"></button>
    <span id="lb-label"></span>
    <button type="button" id="lb-next" data-i18n="slides.next"></button>
    <button type="button" id="lb-close" data-i18n="slides.close"></button>
  </div>
</dialog>

<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="/assets/js/timeline.js"></script>
</body>
</html>
